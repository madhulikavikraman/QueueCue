<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="QueueCue: career fair lines, the right resume, and a pitch that sounds like you.">
  <meta name="theme-color" content="#990000">

  <!-- Installable to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QueueCue">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>QueueCue</title>
  <style>
    html, body { background: #FBF6EC; margin: 0; }
    #qq-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font: 600 16px -apple-system, system-ui, sans-serif; color: #1D1B16; gap: 12px; }
    #qq-loading b { background: #990000; color: #fff; padding: 2px 10px; font-size: 28px; font-weight: 900; }
  </style>
</head>
<body>
  <div id="qq-loading"><b>qq</b><span>Loading QueueCue</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('qq-loading'); if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
